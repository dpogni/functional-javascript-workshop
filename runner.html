<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop sandbox</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1a1a1a; background: #fff; }
      button, input, textarea, select { font: inherit; }
      button { padding: 4px 10px; margin: 2px; cursor: pointer; }
      input[type='text'], input:not([type]), input[type='email'], input[type='password'], textarea { padding: 4px 6px; }
      .sandbox-error { color: #b42318; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #fef3f2; border: 1px solid #fecdca; border-radius: 6px; padding: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/runner/runner.js"></script>
  </body>
</html>
